# ============================================================
#  HomeDeck – 7" Home Assistant panel
#  Board: Sunton ESP32-8048S070C (ESP32-S3, 800x480 RGB, GT911)
#  Add-on PCB: SHT40 + BH1750 (I2C), LD2410C (UART), buzzer
# ============================================================

substitutions:
  name: homedeck
  # ---- change these to YOUR Home Assistant entity IDs ----
  light_lounge: light.lounge
  light_kitchen: light.kitchen
  light_bedroom: light.bedroom
  fan_bedroom: fan.bedroom
  climate_ac: climate.living_room
  media: media_player.lounge
  weather: weather.home

esphome:
  name: ${name}
  friendly_name: HomeDeck
  on_boot:
    priority: -100
    then:
      - script.execute: wake_screen

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz

# UART0 (GPIO43/44) is used by the LD2410C, so turn off serial logging.
# After the first USB flash, update over Wi-Fi (OTA).
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret api_key
  actions:
    # Call this from Home Assistant to play a sound, e.g. for the doorbell
    - action: play_tone
      variables:
        song: string
      then:
        - rtttl.play: !lambda 'return song;'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "HomeDeck Fallback"

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: target_brightness
    type: float
    initial_value: '0.8'

# ---------------- Buses ----------------
i2c:
  id: bus_a
  sda: GPIO19          # shared with the GT911 touch chip
  scl: GPIO20
  scan: true

uart:
  id: ld_uart
  tx_pin: GPIO43       # -> LD2410C RX
  rx_pin: GPIO44       # <- LD2410C TX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld_uart

# ---------------- Display + touch ----------------
display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO41
    hsync_pin: GPIO39
    vsync_pin: GPIO40
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: true      # if the image looks shifted/garbled, try false
    hsync_pulse_width: 30
    hsync_back_porch: 16
    hsync_front_porch: 210
    vsync_pulse_width: 13
    vsync_back_porch: 10
    vsync_front_porch: 22
    data_pins:
      red: [GPIO14, GPIO21, GPIO47, GPIO48, GPIO45]
      green: [GPIO9, GPIO46, GPIO3, GPIO8, GPIO16, GPIO1]
      blue: [GPIO15, GPIO7, GPIO6, GPIO5, GPIO4]

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    reset_pin: GPIO38
    on_touch:
      - script.execute: wake_screen

# ---------------- Backlight + buzzer ----------------
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO2
    frequency: 1000Hz
  - platform: ledc
    id: buzzer_out
    pin: GPIO18        # NPN driver on the add-on PCB

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

rtttl:
  output: buzzer_out
  gain: 60%

# ---------------- Sensors ----------------
sensor:
  - platform: sht4x
    update_interval: 30s
    temperature:
      id: room_temp
      name: "Room Temperature"
      on_value:
        - lvgl.label.update:
            id: lbl_room
            text:
              format: "Room  %.1f°C  ·  %.0f%%"
              args: [ 'x', 'id(room_hum).state' ]
    humidity:
      id: room_hum
      name: "Room Humidity"

  - platform: bh1750
    id: room_lux
    name: "Room Light"
    update_interval: 5s
    on_value:
      - script.execute: auto_brightness

  # From Home Assistant
  - platform: homeassistant
    id: outside_temp
    entity_id: ${weather}
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: lbl_weather_temp
          text:
            format: "%.0f°"
            args: [ 'x' ]

  - platform: homeassistant
    id: ac_setpoint
    entity_id: ${climate_ac}
    attribute: temperature
    on_value:
      - lvgl.arc.update:
          id: arc_ac
          value: !lambda 'return (int) x;'
      - lvgl.label.update:
          id: lbl_ac_set
          text:
            format: "%.0f°C"
            args: [ 'x' ]

text_sensor:
  - platform: homeassistant
    id: weather_state
    entity_id: ${weather}
    on_value:
      - lvgl.label.update:
          id: lbl_weather_desc
          text: !lambda 'return x;'

  - platform: homeassistant
    id: media_title
    entity_id: ${media}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: lbl_media_title
          text: !lambda 'return x.empty() ? std::string("Nothing playing") : x;'

binary_sensor:
  # Presence (UART data, nice for Home Assistant)
  - platform: ld2410
    has_target:
      name: "Presence"

  # Presence (OUT pin, fast, used to wake the screen)
  - platform: gpio
    id: presence_out
    name: "Presence (OUT)"
    pin: GPIO17
    on_press:
      - script.execute: wake_screen
    on_release:
      - script.execute: idle_timer

  # Keep the room tiles in sync with Home Assistant
  - platform: homeassistant
    id: ha_lounge
    entity_id: ${light_lounge}
    on_state:
      - lvgl.widget.update:
          id: btn_lounge
          state:
            checked: !lambda 'return x;'
  - platform: homeassistant
    id: ha_kitchen
    entity_id: ${light_kitchen}
    on_state:
      - lvgl.widget.update:
          id: btn_kitchen
          state:
            checked: !lambda 'return x;'
  - platform: homeassistant
    id: ha_bedroom
    entity_id: ${light_bedroom}
    on_state:
      - lvgl.widget.update:
          id: btn_bedroom
          state:
            checked: !lambda 'return x;'
  - platform: homeassistant
    id: ha_fan
    entity_id: ${fan_bedroom}
    on_state:
      - lvgl.widget.update:
          id: btn_fan
          state:
            checked: !lambda 'return x;'

# ---------------- Logic ----------------
script:
  # Turn the screen on and (re)start the sleep countdown
  - id: wake_screen
    mode: restart
    then:
      - lvgl.resume:
      - light.turn_on:
          id: backlight
          brightness: !lambda 'return id(target_brightness);'
      - script.execute: idle_timer

  # After 45 s with nobody in front of it, turn the screen off
  - id: idle_timer
    mode: restart
    then:
      - delay: 45s
      - if:
          condition:
            binary_sensor.is_off: presence_out
          then:
            - light.turn_off: backlight
            - lvgl.pause:

  # Dim in a dark room, bright in a light room
  - id: auto_brightness
    then:
      - lambda: |-
          float b = 0.15f + id(room_lux).state / 400.0f;
          id(target_brightness) = std::max(0.15f, std::min(1.0f, b));
      - if:
          condition:
            light.is_on: backlight
          then:
            - light.turn_on:
                id: backlight
                brightness: !lambda 'return id(target_brightness);'

  - id: click
    then:
      - rtttl.play: "click:d=32,o=6,b=250:c"

interval:
  - interval: 10s
    then:
      - if:
          condition:
            time.has_time:
          then:
            - lvgl.label.update:
                id: lbl_time
                text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
            - lvgl.label.update:
                id: lbl_date
                text: !lambda 'return id(ha_time).now().strftime("%A, %d %B");'

# ---------------- UI (LVGL) ----------------
lvgl:
  displays: [main_display]
  touchscreens: [touch]
  buffer_size: 25%
  bg_color: 0x0F1726
  style_definitions:
    - id: tile
      bg_color: 0x1F2B44
      radius: 16
      border_width: 0
      text_color: 0xEEF2F7
      pad_all: 14
    - id: navbtn
      bg_color: 0x1F2B44
      radius: 12
      border_width: 0
      text_color: 0xEEF2F7

  # Navigation bar, shown on every page
  top_layer:
    widgets:
      - obj:
          align: BOTTOM_MID
          width: 100%
          height: 70
          bg_color: 0x0B111C
          border_width: 0
          radius: 0
          pad_all: 8
          layout:
            type: flex
            flex_flow: row
            flex_align_main: space_evenly
            flex_align_cross: center
          widgets:
            - button:
                styles: navbtn
                width: 170
                height: 52
                on_click:
                  - lvgl.page.show: page_home
                widgets:
                  - label: { text: "Home", align: CENTER }
            - button:
                styles: navbtn
                width: 170
                height: 52
                on_click:
                  - lvgl.page.show: page_rooms
                widgets:
                  - label: { text: "Rooms", align: CENTER }
            - button:
                styles: navbtn
                width: 170
                height: 52
                on_click:
                  - lvgl.page.show: page_climate
                widgets:
                  - label: { text: "Climate", align: CENTER }
            - button:
                styles: navbtn
                width: 170
                height: 52
                on_click:
                  - lvgl.page.show: page_media
                widgets:
                  - label: { text: "Media", align: CENTER }

  pages:
    # ---------- HOME ----------
    - id: page_home
      widgets:
        - label:
            id: lbl_time
            x: 40
            y: 40
            text: "--:--"
            text_font: montserrat_48
            text_color: 0xEEF2F7
        - label:
            id: lbl_date
            x: 44
            y: 110
            text: ""
            text_font: montserrat_20
            text_color: 0x8EA0BD
        - label:
            id: lbl_weather_temp
            x: 600
            y: 40
            text: "--°"
            text_font: montserrat_48
            text_color: 0xFFD166
        - label:
            id: lbl_weather_desc
            x: 604
            y: 110
            text: ""
            text_font: montserrat_20
            text_color: 0x8EA0BD
        - label:
            id: lbl_room
            x: 44
            y: 200
            text: "Room  --"
            text_font: montserrat_24
            text_color: 0xEEF2F7

    # ---------- ROOMS ----------
    - id: page_rooms
      widgets:
        - obj:
            x: 20
            y: 20
            width: 760
            height: 370
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_evenly
              pad_row: 18
            widgets:
              - button:
                  id: btn_lounge
                  styles: tile
                  checkable: true
                  width: 350
                  height: 160
                  checked:
                    bg_color: 0xF6B73C
                    text_color: 0x2A1D00
                  on_click:
                    - script.execute: click
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light_lounge}
                  widgets:
                    - label: { text: "Lounge", align: TOP_LEFT, text_font: montserrat_24 }
              - button:
                  id: btn_kitchen
                  styles: tile
                  checkable: true
                  width: 350
                  height: 160
                  checked:
                    bg_color: 0xF6B73C
                    text_color: 0x2A1D00
                  on_click:
                    - script.execute: click
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light_kitchen}
                  widgets:
                    - label: { text: "Kitchen", align: TOP_LEFT, text_font: montserrat_24 }
              - button:
                  id: btn_bedroom
                  styles: tile
                  checkable: true
                  width: 350
                  height: 160
                  checked:
                    bg_color: 0xF6B73C
                    text_color: 0x2A1D00
                  on_click:
                    - script.execute: click
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: ${light_bedroom}
                  widgets:
                    - label: { text: "Bedroom", align: TOP_LEFT, text_font: montserrat_24 }
              - button:
                  id: btn_fan
                  styles: tile
                  checkable: true
                  width: 350
                  height: 160
                  checked:
                    bg_color: 0x2A9D8F
                  on_click:
                    - script.execute: click
                    - homeassistant.action:
                        action: fan.toggle
                        data:
                          entity_id: ${fan_bedroom}
                  widgets:
                    - label: { text: "Fan", align: TOP_LEFT, text_font: montserrat_24 }

    # ---------- CLIMATE ----------
    - id: page_climate
      widgets:
        - arc:
            id: arc_ac
            align: CENTER
            y: -30
            width: 300
            height: 300
            min_value: 16
            max_value: 30
            value: 22
            adjustable: true
            on_value:
              - lvgl.label.update:
                  id: lbl_ac_set
                  text:
                    format: "%d°C"
                    args: [ 'x' ]
            on_release:
              - script.execute: click
              - homeassistant.action:
                  action: climate.set_temperature
                  data:
                    entity_id: ${climate_ac}
                    temperature: !lambda 'return x;'
        - label:
            id: lbl_ac_set
            align: CENTER
            y: -30
            text: "22°C"
            text_font: montserrat_48
            text_color: 0xEEF2F7
        - label:
            align: CENTER
            y: 40
            text: "Air-con setpoint"
            text_color: 0x8EA0BD

    # ---------- MEDIA ----------
    - id: page_media
      widgets:
        - label:
            id: lbl_media_title
            align: TOP_MID
            y: 60
            width: 700
            long_mode: dot
            text_align: CENTER
            text: "Nothing playing"
            text_font: montserrat_28
            text_color: 0xEEF2F7
        - obj:
            align: CENTER
            y: -10
            width: 520
            height: 110
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: flex
              flex_flow: row
              flex_align_main: space_evenly
              flex_align_cross: center
            widgets:
              - button:
                  styles: tile
                  width: 120
                  height: 90
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_previous_track
                        data: { entity_id: "${media}" }
                  widgets:
                    - label: { text: "\uF048", align: CENTER, text_font: montserrat_28 }
              - button:
                  styles: tile
                  width: 140
                  height: 90
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_play_pause
                        data: { entity_id: "${media}" }
                  widgets:
                    - label: { text: "\uF04B", align: CENTER, text_font: montserrat_28 }
              - button:
                  styles: tile
                  width: 120
                  height: 90
                  on_click:
                    - homeassistant.action:
                        action: media_player.media_next_track
                        data: { entity_id: "${media}" }
                  widgets:
                    - label: { text: "\uF051", align: CENTER, text_font: montserrat_28 }
        - slider:
            align: CENTER
            y: 110
            width: 500
            min_value: 0
            max_value: 100
            value: 40
            on_release:
              - homeassistant.action:
                  action: media_player.volume_set
                  data:
                    entity_id: ${media}
                    volume_level: !lambda 'return x / 100.0;'