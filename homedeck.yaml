esphome:
  name: homedeck
  friendly_name: HomeDeck

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB # Adjust if your Sunton board uses 8MB/16MB flash

wifi:
  ssid: "YOUR_WIFI_SSID"
  password: "YOUR_WIFI_PASSWORD"
  ap:
    ssid: "HomeDeck Fallback Hotspot"
    password: "fallback_password"

captive_portal:

logger:
  level: DEBUG

api:
  encryption:
    key: "YOUR_API_ENCRYPTION_KEY"

ota:
  - platform: esphome

# -----------------------------------------------------------------------------
# I2C Bus (Shared for SHT40 and BH1750 on GPIO19 / GPIO20)
# -----------------------------------------------------------------------------
i2c:
  - id: bus_i2c
    sda: GPIO19
    scl: GPIO20
    scan: true
    frequency: 400kHz

# -----------------------------------------------------------------------------
# UART for LD2410C mmWave Radar Presence Sensor
# -----------------------------------------------------------------------------
uart:
  - id: uart_ld2410
    tx_pin: GPIO43
    rx_pin: GPIO44
    baudrate: 256000
    parity: NONE
    stop_bits: 1

# -----------------------------------------------------------------------------
# Sensors & Peripherals
# -----------------------------------------------------------------------------
sensor:
  # SHT40 Temperature & Humidity
  - platform: sht4x
    temperature:
      name: "HomeDeck Temperature"
      id: homedeck_temp
    humidity:
      name: "HomeDeck Humidity"
      id: homedeck_humidity
    address: 0x44
    update_interval: 60s

  # BH1750 Ambient Light Sensor (Auto-brightness)
  - platform: bh1750
    name: "HomeDeck Illuminance"
    id: homedeck_illuminance
    address: 0x23
    update_interval: 10s

  # LD2410C mmWave Radar Values
  - platform: ld2410
    uart_id: uart_ld2410
    has_target:
      name: "HomeDeck Presence Target"
    moving_target_distance:
      name: "HomeDeck Moving Distance"
    stationary_target_distance:
      name: "HomeDeck Stationary Distance"

# Binary sensors for presence detection output and digital states
binary_sensor:
  # LD2410C discrete presence output on GPIO17
  - platform: gpio
    pin:
      number: GPIO17
      mode: INPUT
    name: "HomeDeck Presence Detected"
    id: presence_pin
    on_press:
      then:
        - logger.log: "Presence detected! Waking display..."
        - display.page.show: main_page
        # Add display backlight turn-on logic here if using manual dimming

# Buzzer output via NPN transistor on GPIO18
output:
  - platform: ledc
    pin: GPIO18
    id: buzzer_output
    frequency: 2000Hz

# -----------------------------------------------------------------------------
# Display & LVGL UI Integration
# -----------------------------------------------------------------------------
# Note: Specific display parameters (RGB panel pins, resolutions, and touch controllers) 
# depend on the exact Sunton driver configuration. Ensure you include the appropriate 
# display component drivers for the 8048S070C board.
display:
  - platform: ili9341 # (Placeholder: update to match your Sunton RGB panel driver configuration)
    id: my_display
    # Add your specific display parameters, width: 800, height: 480, dimensions, etc.

lvgl:
  id: my_lvgl
  displays:
    - my_display
  pages:
    - id: main_page
      widgets:
        - label:
            text: "Welcome to HomeDeck"
            text_font: roboto_18
            align: CENTER
            y: -50
